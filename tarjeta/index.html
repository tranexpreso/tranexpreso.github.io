<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta Digital | Transporte Expreso</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" href="../assets/logo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        /* Estilos específicos solo para esta página provisional */
        .coming-soon-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        .coming-soon-icon {
            font-size: 5rem;
            color: var(--rojo);
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="coming-soon-container">
        <i class="fa-solid fa-id-card coming-soon-icon"></i>
        <h1 style="font-size: 3rem; color: var(--blanco); margin-bottom: 20px;">Tarjeta Digital</h1>
        <h2 style="color: var(--rojo); margin-bottom: 30px; font-size: 1.5rem;">Próximamente</h2>
        <p style="font-size: 1.2rem; max-width: 600px; margin-bottom: 40px;">
            Estamos trabajando en nuestra tarjeta de presentación digital. Muy pronto podrás acceder a todos nuestros contactos y servicios de forma rápida y elegante.
        </p>
        <a href="../index.html" class="btn">
            <i class="fa-solid fa-arrow-left" style="margin-right: 10px;"></i> Volver al Inicio
        </a>
    </div>

</body>
</html>
